<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang }}">
    {{- partial "head.html" . -}}
    <body{{- if partial "has-toc.html" . }} class="has-toc"{{- end -}}>
        {{- partial "header.html" . -}}
        <main id="content" data-pagefind-body>
        {{- block "main" . }}{{- end }}
        </main>
        {{- partial "footer.html" . -}}
        <pagefind-modal data-pagefind-ignore></pagefind-modal>
    </body>
</html>
